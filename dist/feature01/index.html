<!doctype html>
<html lang="ja">
  <head>

            height="18">

        <button

          aria-label="メニューを開く"
        >
          <span class="l-header__toggle-bar"></span>
          <span class="l-header__toggle-bar"></span>
          <span class="l-header__toggle-bar"></span>
        </button>
        <div class="l-header__menu" id="header-menu">
          <nav class="l-header__nav" aria-label="メインメニュー">
            <ul class="l-header__nav-list">
              <li><a class="l-header__nav-link" href="#" data-placeholder>コーディング代行</a></li>
              <li><a class="l-header__nav-link" href="#" data-placeholder>kintoneアプリ開発</a></li>

          </nav>
          <ul class="l-header__actions">
            <li><a class="l-header__action l-header__action--estimate" href="#" data-placeholder>自動見積り</a></li>
            <li><a class="l-header__action l-header__action--contact" href="#" data-placeholder>お問合せ</a></li>
            <li>
              <a class="l-header__search" href="#" aria-label="検索" data-placeholder>

          <ul class="l-footer__ctas">
            <li>
              <a class="l-footer__cta l-footer__cta--deadline" href="#" data-placeholder>

                  class="l-footer__cta-icon"
                  src="../img/common/ill_footer_consult.svg"

                  height="101"

                  aria-hidden="true">

                  <span class="l-footer__cta-title">

                    <img
                      class="l-footer__cta-arrow"

                      aria-hidden="true">

                      aria-hidden="true">
