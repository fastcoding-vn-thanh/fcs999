*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","Hiragino Sans",sans-serif}
code{font:12px ui-monospace,Menlo,monospace;background:var(--chk);padding:1px 5px;border-radius:4px}
a{color:var(--accent)}
header{max-width:1400px;margin:auto;padding:24px 24px 8px}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:0 24px}
nav.tabs div{max-width:1400px;margin:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{border:0;background:none;color:var(--mute);font:inherit;padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:600}
.wrap{max-width:1400px;margin:auto;padding:20px 24px 60px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=search]{flex:1 1 220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--mute);font-size:13px;margin:0 0 16px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.shot{background:var(--chk);padding:16px;display:flex;justify-content:center;align-items:center;overflow:auto;min-height:80px}
.shot img{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px #0003}
.noimg{color:var(--mute);font-size:12px}
.body{padding:14px 16px 16px;display:grid;gap:8px}
.title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title h2,.title h3{margin:0;font-size:16px;font-family:ui-monospace,Menlo,monospace}

.use{height:6px;background:var(--chk);border-radius:3px;overflow:hidden}.use i{display:block;height:100%;background:var(--accent)}
/* matrix */
.mx{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:24px}
table{border-collapse:collapse;width:100%}
.mx th,.mx td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-size:12px}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-family:ui-monospace,Menlo,monospace}
.mx thead th{writing-mode:vertical-rl;transform:rotate(180deg);height:190px;vertical-align:bottom;font-family:ui-monospace,Menlo,monospace;font-weight:400}
.mx thead th:first-child{writing-mode:horizontal-tb;transform:none;vertical-align:bottom}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.dot.q{background:none;border:1px dashed var(--warn)}

.lay{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;display:grid;grid-template-columns:minmax(260px,420px) 1fr}
.lay .diagram{background:var(--chk);padding:16px;display:grid;gap:8px;align-content:start}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

const view=document.getElementById('view');

const pagesWithFrames=D.pages.filter(p=>p.node);

function warnBox(){
  return D.warnings.length?`<details class="warns" style="border:1px solid var(--line);border-radius:8px;margin-top:24px"><summary>${D.warnings.length} parse warnings</summary><ul>${D.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details>`:'';
}

/* ---------- 1 layout ---------- */
const partImg=n=>(D.parts.find(x=>x.name===n)||{}).img;
const tabOf=n=>(D.parts.find(x=>x.name===n)||{}).folder==='module'?'module':'parts';
function layoutTab(){
  const inferred=D.layouts.some(l=>l.source==='inferred');
  const hdr=l=>l.header?`<div class="box">${partImg(l.header)?`<img src="${partImg(l.header).src}" alt="">`:''}<div class="lbl"><a href="#${tabOf(l.header)}/${esc(l.header)}">header${l.header!=='header'?' · '+esc(l.header):''}</a></div></div>`:'<div class="box"><div class="lbl">no header</div></div>';
  const ftr=l=>l.footer?`<div class="box">${partImg(l.footer)?`<img src="${partImg(l.footer).src}" alt="">`:''}<div class="lbl"><a href="#${tabOf(l.footer)}/${esc(l.footer)}">footer${l.footer!=='footer'?' · '+esc(l.footer):''}</a></div></div>`:'<div class="box"><div class="lbl">no footer</div></div>';
  return `<p class="note">${inferred?'<b>Inferred.</b> The analysis has no "2a. Layouts" table, so every page counts as one layout unless its header or footer differs or is missing. ':'Read from the "2a. Layouts" table in the analysis. '}A layout is the big frame only; what sits inside <code>main</code> differs per page and is the Semantic tab.</p>`+
  D.layouts.map(l=>`<section class="lay"><div class="diagram">${hdr(l)}<div class="box main">main · sections differ per page</div>${ftr(l)}</div>
<div class="body" style="padding:16px;display:grid;gap:8px;align-content:start"><div class="title"><h2 style="margin:0;font-size:16px">${esc(l.name)}</h2><span class="badge">${l.pages.length} page${l.pages.length>1?'s':''}</span></div>
<div>${l.pages.map(p=>`<code>${esc(p)}</code>`).join(' ')}</div>
${l.notes?`<div class="fine">${md(l.notes)}</div>`:''}</div></section>`).join('')+
  `<p class="fine">Pages without frames yet: ${D.pages.filter(p=>!p.node).map(p=>`<code>${esc(p.path)}</code>`).join(' ')||'none'}</p>`+warnBox();
}

function cards(list){

    return `<article class="card wide" data-card="${esc(d.name)}">${shot(d.img)}

function matrix(list){
  const ps=pagesWithFrames;
  return `<div class="mx"><table><thead><tr><th>block</th>${ps.map(p=>`<th>${esc(p.path)}</th>`).join('')}<th></th></tr></thead><tbody>${list.map(d=>
    `<tr><td>${esc(d.name)}</td>${ps.map(p=>`<td>${d.usedOn.includes(p.path)?'<span class="dot"></span>':''}</td>`).join('')}<td>${d.usedOn.length?'':'<span class="dot q" title="the Pages cell could not be read: '+esc(d.pages)+'"></span>'}</td></tr>`).join('')}</tbody></table></div>
<p class="fine">The dots are read from the Pages column of §3a. A dashed circle on the right means that cell named no page the script recognised.</p>`;
}
function partsTab(folder){
  const list=D.parts.filter(d=>d.folder===folder);
  const legacy=D.catalogFormat==='legacy'?'<p class="note"><b>Older format.</b> This analysis has the five-column components table from before the catalog, so Variants are empty. Run <code>/fa-analyze</code> again to get the catalog.</p>':'';
  const blurb=folder==='parts'?'Finished blocks you put on a page: header, footer, shared sections (AN-02).':'Small pieces composed inside a block: button, tag, card (AN-03).';
  return `<p class="note">${blurb}</p>${legacy}<p class="fine">${list.length} ${folder==='parts'?'parts':'modules'}</p>`+matrix(list)+cards(list)+droppedBox()+warnBox();
}
function droppedBox(){
  if(!D.dropped||!D.dropped.length)return '';
  return `<details class="warns" style="border:1px solid var(--line);border-radius:8px;margin-top:24px"><summary>${D.dropped.length} repeated blocks the analysis left out (§3c)</summary><p class="fine">Read this list to overrule a wrong drop: each line is a block the design repeats and the analysis did not make a row, with its reason.</p><ul>${D.dropped.map(d=>`<li>${md(d.raw)}</li>`).join('')}</ul></details>`;
}

/* ---------- 4 semantic ---------- */
/* The outline is already a tree (`ul > li > article > h3`), so this only draws it. */
const kindOf=t=>/^h1$/.test(t)?'h h1':/^h[1-6]$/.test(t)?'h':/^(ul|ol|li)$/.test(t)?'l':'o';
const flat=ns=>ns.flatMap(n=>[n,...flat(n.kids)]);
let bk=0;
function nodeHtml(n,sec,acc){
  if(n.sec){
    const mine=[];
    const all=flat(sec.tree),outlined=all.filter(x=>x.boxes&&x.boxes.length).length;
    const head=`<span class="n sec" title="${esc(sec.raw)}"><span class="k">${esc(sec.name)}</span>${outlined?`<span class="fine cnt" title="elements of this section with a position on the frame">▣ ${outlined} of ${all.length}</span>`:''}${sec.isPart?`<a class="badge b-parts" style="text-decoration:none" href="#${tabOf(sec.part&&sec.part!=='part'?sec.part:sec.name)}/${esc(sec.part&&sec.part!=='part'?sec.part:sec.name)}">part${sec.part&&sec.part!=='part'?' · '+esc(sec.part):''}</a>`:''}</span>`;
    const kids=sec.tree.length?`<ul>${sec.tree.map(k=>nodeHtml(k,sec,mine)).join('')}</ul>`:'';
    const area=b=>b[2]*b[3];
    const boxes=mine.flatMap(a=>a.boxes.map(b=>({a,b}))).sort((x,y)=>area(y.b)-area(x.b))
      .map(({a,b})=>`<i class="bx ${a.kind}" data-bx="${a.key}" title="${esc(a.label)}" style="left:${b[0]*100}%;top:${b[1]*100}%;width:${b[2]*100}%;height:${b[3]*100}%"></i>`).join('');
    const frame=sec.img?`<div class="frame"><div class="fw" style="max-width:${sec.img.w}px"><a href="${sec.figma}" target="_blank" rel="noopener"><img src="${sec.img.src}" loading="lazy" alt=""></a>${boxes}</div></div>`:'';
    return `<li class="secli">${head}${kids}${frame}</li>`;
  }
  const label=n.t+(n.count?' ×'+n.count:'');
  const has=n.boxes&&n.boxes.length;
  const key=has?++bk:0;
  if(has)acc.push({key,kind:kindOf(n.t).split(' ')[0],label:label+(n.nodes.length?'  @'+n.nodes.join(','):''),boxes:n.boxes});
  const kids=n.kids.length?`<ul>${n.kids.map(k=>nodeHtml(k,sec,acc)).join('')}</ul>`:'';
  return `<li><span class="n ${kindOf(n.t)}${n.uncertain?' u':''}${has?' has-box':''}"${has?` data-bx="${key}"`:''}><span class="k">${esc(label)}</span>${n.text?`<span class="tx">${esc(n.text)}</span>`:''}</span>${kids}</li>`;
}
function pageTree(p){
  const secs=p.sections.map(s=>nodeHtml({sec:true},s,null)).join('');
  return `<ul class="tr"><li><span class="n root"><span class="k">header</span><span class="tx">${esc(p.header)}</span></span></li>
<li><span class="n root"><span class="k">main</span></span><ul>${secs}</ul></li>
${p.footer?'<li><span class="n root"><span class="k">footer</span></span></li>':''}</ul>`;
}
let frames=true,allbx=false,outlines=false,pgOpen=null;
function semanticTab(){
  return `<p class="note">The structural tags only, nested the way the outline nests them: headings, lists, definition lists, tables, forms, figures, articles, address, time. Hover a section name for the analysis's own line. A dashed tag is one the analysis marks uncertain. Headings inside a shared part such as <code>feature-list</code> are not in this outline.</p>
<div class="tools"><button class="chip" id="fr" aria-pressed="${frames}">Show frames</button><button class="chip" id="ol" aria-pressed="${outlines}">Outlines</button>${outlines?`<button class="chip" id="ab" aria-pressed="${allbx}">Show every outline</button><span class="fine">A ▣ marks an element with a position: hover it, or hover the frame, to see where it is. Elements with no <code>@id</code> in the outline have none.</span>`:''}</div><div class="${[frames?'frames':'',outlines?'ol':'',outlines&&allbx?'allbx':''].join(' ')}">`+
  D.pages.map((p,i)=>{
    if(!p.node)return `<div class="pg"><div style="padding:12px 16px"><b><code>${esc(p.path)}</code></b> <span class="fine">${esc(p.note)}</span></div></div>`;
    return `<details class="pg" data-path="${esc(p.path)}"${(pgOpen?pgOpen.has(p.path):i<1)?' open':''}><summary><h2>${esc(p.path)}</h2>
<a href="${p.figma}" target="_blank" rel="noopener" class="fine">${p.node}</a>${p.noSp?'<span class="badge b-no">no SP frame</span>':''}
${p.warnings.length?`<span class="badge" style="background:var(--warn)">${p.warnings.length} check${p.warnings.length>1?'s':''}</span>`:'<span class="badge b-yes">headings ok</span>'}</summary>
${p.warnings.length?`<div class="warns">${p.warnings.map(esc).join('<br>')}</div>`:''}
<div class="tree">${pageTree(p)}</div></details>`}).join('')+`</div>`+warnBox();
}

/* ---------- router ---------- */
const tabs={layout:layoutTab,parts:()=>partsTab('parts'),module:()=>partsTab('module'),semantic:semanticTab};
/* #catalog was one tab for a while; a link to it lands on the parts. */
const alias={catalog:'parts'};
function show(){
  const [h,arg]=location.hash.slice(1).split('/');
  const t=tabs[alias[h]||h]?(alias[h]||h):'layout';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  view.innerHTML=tabs[t]();
  const fr=document.getElementById('fr');
  if(fr)fr.onclick=()=>{frames=!frames;show()};
  const ol=document.getElementById('ol');
  if(ol)ol.onclick=()=>{outlines=!outlines;show()};
  const ab=document.getElementById('ab');
  if(ab)ab.onclick=()=>{allbx=!allbx;show()};
  if((t==='parts'||t==='module')&&arg){const c=[...document.querySelectorAll('[data-card]')].find(x=>x.dataset.card===arg);if(c){c.scrollIntoView({block:'center'});c.classList.add('flash')}history.replaceState(null,'','#'+t)}
}
const hl=(e,on)=>{const t=e.target.closest&&e.target.closest('[data-bx]');if(t&&t.closest('.ol'))document.querySelectorAll(`[data-bx="${t.dataset.bx}"]`).forEach(x=>x.classList.toggle('hl',on))};
view.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.pg')){pgOpen=new Set([...document.querySelectorAll('details.pg[open]')].map(d=>d.dataset.path))}},true);
view.addEventListener('mouseover',e=>hl(e,true));view.addEventListener('mouseout',e=>hl(e,false));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab});
addEventListener('hashchange',show);show();
</script>
</body>
</html>
